<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 200" width="100%" height="100%">
  <defs>
    <!-- Bold Rich Orange Gradient for Main Logo Swoosh & Text -->
    <linearGradient id="orangeLogoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5500" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Warm Shallow Yellow Light Aura & Backlight Bloom Filter -->
    <filter id="yellowLightBloom" x="-40%" y="-40%" width="180%" height="180%">
      <!-- Wide Soft Shallow Yellow Light Glow Behind Logo -->
      <feFlood flood-color="#facc15" flood-opacity="0.65" result="yellowFlood" />
      <feComposite in="yellowFlood" in2="SourceAlpha" operator="in" result="yellowMask" />
      <feGaussianBlur in="yellowMask" stdDeviation="11" result="yellowAura" />
      
      <!-- Inner Bright Yellow Glow Bloom -->
      <feFlood flood-color="#ffe600" flood-opacity="0.85" result="brightYellowFlood" />
      <feComposite in="brightYellowFlood" in2="SourceAlpha" operator="in" result="brightMask" />
      <feGaussianBlur in="brightMask" stdDeviation="4" result="brightYellowAura" />

      <feMerge>
        <feMergeNode in="yellowAura" />
        <feMergeNode in="brightYellowAura" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#yellowLightBloom)">
    <!-- Layer 1: Top Primary Orange Car Swoosh Curve -->
    <path d="M 50 95 
             C 120 90, 185 58, 235 34 
             C 295 8, 410 6, 510 34 
             C 555 46, 585 58, 610 66 
             C 570 61, 535 51, 495 41 
             C 410 20, 305 20, 245 44 
             C 200 64, 135 93, 75 97 
             Z" 
          fill="url(#orangeLogoGrad)" />
    
    <!-- Layer 2: Second Parallel Orange Accent Layer Line -->
    <path d="M 90 103 
             C 150 97, 210 71, 260 53 
             C 310 35, 400 33, 480 51 
             C 520 61, 545 69, 565 75 
             C 540 70, 515 62, 475 52 
             C 400 36, 315 37, 265 55 
             C 220 71, 160 97, 105 103 
             Z" 
          fill="url(#orangeLogoGrad)" />

    <!-- Additional Lower Hood Accent Line -->
    <path d="M 35 110 
             C 70 105, 120 98, 165 88 
             C 125 94, 75 102, 40 108 
             Z" 
          fill="url(#orangeLogoGrad)" opacity="0.95" />

    <!-- Studio Orange Typography: COUSINS CAR CARE -->
    <text x="330" y="168" 
          font-family="'Times New Roman', 'Outfit', 'Cinzel', serif" 
          font-size="54" 
          font-weight="800" 
          letter-spacing="5" 
          text-anchor="middle" 
          fill="url(#orangeLogoGrad)">
      COUSINS CAR CARE
    </text>
  </g>
</svg>
