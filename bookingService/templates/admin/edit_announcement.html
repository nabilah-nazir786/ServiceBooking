{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Announcement | Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <div class="bg-ambient">
        <div class="glow-orb glow-orb-1"></div>
        <div class="glow-orb glow-orb-2"></div>
    </div>

    <nav class="navbar">
        <a href="{% url 'bookingService:home' %}" class="logo">
            <img src="{% static 'logo.svg' %}" alt="Cousins Car Care Logo" class="logo-brand-img">
            <span class="logo-badge">ADMIN</span>
        </a>
        <div class="nav-actions">
            <a href="{% url 'bookingService:admin_dashboard' %}" class="btn btn-secondary btn-sm"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
        </div>
    </nav>

    <div class="main-wrapper" style="max-width: 800px; margin: 3rem auto; padding: 0 1.5rem;">
        <div class="dash-header-card" style="margin-bottom: 2rem;">
            <div class="dash-user-info">
                <div class="avatar-box" style="background: var(--grad-gold);">
                    <i class="fa-solid fa-bullhorn"></i>
                </div>
                <div class="dash-user-details">
                    <h1>Edit <span>Announcement / Offer</span></h1>
                    <p>Update promotion details for {{ announcement.title }}</p>
                </div>
            </div>
        </div>

        <div class="panel-card">
            <form method="POST" action="{% url 'bookingService:edit_announcement' announcement.id %}" enctype="multipart/form-data" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                {% csrf_token %}

                <div class="form-group" style="grid-column: span 2;">
                    <label>Announcement Title *</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-bullhorn input-icon"></i>
                        <input type="text" name="title" class="form-input" value="{{ announcement.title }}" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Start Date *</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-calendar-check input-icon"></i>
                        <input type="date" name="start_date" class="form-input" value="{{ announcement.start_date|date:'Y-m-d' }}" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>End Date *</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-calendar-xmark input-icon"></i>
                        <input type="date" name="end_date" class="form-input" value="{{ announcement.end_date|date:'Y-m-d' }}" required>
                    </div>
                </div>

                <div class="form-group" style="grid-column: span 2;">
                    <label>Announcement Image (Optional)</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-image input-icon"></i>
                        <input type="file" name="image" class="form-input" accept="image/*" style="padding-top: 0.6rem;">
                    </div>
                    {% if announcement.image %}
                        <small style="color: var(--text-muted); display: block; margin-top: 0.5rem;">Current Image: <a href="{{ announcement.image.url }}" target="_blank" style="color: var(--primary-cyan);">View Image</a></small>
                    {% endif %}
                </div>

                <div class="form-group" style="grid-column: span 2;">
                    <label>Description / Offer Details *</label>
                    <textarea name="description" class="form-input" rows="4" style="padding-left: 1rem;" required>{{ announcement.description }}</textarea>
                </div>

                <div class="form-group" style="grid-column: span 2;">
                    <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                        <input type="checkbox" name="is_visible" {% if announcement.is_visible %}checked{% endif %} style="width: 18px; height: 18px; accent-color: var(--primary-cyan);">
                        <span style="color: var(--text-primary);">Visible on Homepage & Service Catalogue</span>
                    </label>
                </div>

                <div style="grid-column: span 2; display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1rem;">
                    <a href="{% url 'bookingService:admin_dashboard' %}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
